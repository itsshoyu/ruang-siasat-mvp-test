<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Ruang Siasat</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f4f4; font-family: sans-serif; }
        #dashboard-view { display: none; } /* Sembunyikan dashboard awal */
    </style>
</head>
<body>

    <div class="container mt-5">
        
        <!-- STATUS KONEKSI (Untuk Debugging) -->
        <div id="status-msg" class="alert alert-info">Memeriksa koneksi Firebase...</div>

        <!-- 1. FORM LOGIN -->
        <div id="login-view" class="card mx-auto shadow-sm" style="max-width: 400px;">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">Login Redaksi</h4>
                <form id="loginForm">
                    <div class="mb-3">
                        <input type="email" id="email" class="form-control" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" id="password" class="form-control" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Masuk</button>
                </form>
            </div>
        </div>

        <!-- 2. DASHBOARD -->
        <div id="dashboard-view">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Dashboard Artikel</h2>
                <button id="btnLogout" class="btn btn-outline-danger">Keluar</button>
            </div>

            <!-- Form Input -->
            <div class="card mb-4">
                <div class="card-header">Tulis Artikel Baru</div>
                <div class="card-body">
                    <form id="addArticleForm">
                        <input type="text" id="title" class="form-control mb-2" placeholder="Judul Artikel" required>
                        <select id="category" class="form-select mb-2">
                            <option>Eksistensialisme</option>
                            <option>Pendidikan</option>
                            <option>Politik</option>
                        </select>
                        <input type="text" id="image" class="form-control mb-2" placeholder="URL Gambar (https://...)" required>
                        <textarea id="excerpt" class="form-control mb-2" placeholder="Ringkasan singkat" required></textarea>
                        <textarea id="content" class="form-control mb-2" rows="5" placeholder="Isi artikel (HTML)" required></textarea>
                        <button type="submit" class="btn btn-primary">Terbitkan</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- PENTING: type="module" agar bisa import dari config.js -->
    <script type="module">
        // Import fungsi yang dibutuhkan saja
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- KONFIGURASI FIREBASE ---
        // (Pastikan ini PERSIS sama dengan di Firebase Console Anda)
        const firebaseConfig = {
            apiKey: "GANTI_API_KEY_ANDA",
            authDomain: "GANTI_PROJECT_ID.firebaseapp.com",
            projectId: "GANTI_PROJECT_ID",
            storageBucket: "GANTI_PROJECT_ID.appspot.com",
            messagingSenderId: "123...",
            appId: "1:..."
        };

        // Debugging Awal
        const statusMsg = document.getElementById('status-msg');
        let app, auth, db;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            statusMsg.innerText = "Firebase JS Berhasil Dimuat. Menunggu Auth...";
            statusMsg.className = "alert alert-warning";
        } catch (e) {
            statusMsg.innerText = "Error Config: " + e.message;
            statusMsg.className = "alert alert-danger";
        }

        // Elemen UI
        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');

        // 1. Cek Status Login (Auth Listener)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                statusMsg.innerText = "Terhubung sebagai: " + user.email;
                statusMsg.className = "alert alert-success";
                loginView.style.display = 'none';
                dashboardView.style.display = 'block';
            } else {
                statusMsg.innerText = "Silakan Login.";
                statusMsg.className = "alert alert-secondary";
                loginView.style.display = 'block';
                dashboardView.style.display = 'none';
            }
        });

        // 2. Fungsi Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            try {
                statusMsg.innerText = "Mencoba login...";
                await signInWithEmailAndPassword(auth, email, pass);
                // Tidak perlu redirect, onAuthStateChanged akan menangani UI
            } catch (error) {
                alert("Login Gagal: " + error.message);
                statusMsg.innerText = "Error: " + error.message;
            }
        });

        // 3. Fungsi Tambah Artikel
        document.getElementById('addArticleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!confirm("Terbitkan artikel ini?")) return;

            try {
                await addDoc(collection(db, "articles"), {
                    title: document.getElementById('title').value,
                    category: document.getElementById('category').value,
                    image: document.getElementById('image').value,
                    excerpt: document.getElementById('excerpt').value,
                    content: document.getElementById('content').value,
                    createdAt: serverTimestamp()
                });
                alert("Artikel Berhasil Disimpan!");
                document.getElementById('addArticleForm').reset();
            } catch (error) {
                alert("Gagal Simpan: " + error.message);
                console.error("Error adding document: ", error);
            }
        });

        // 4. Logout
        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

    </script>
</body>
</html>
